changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: New features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - fix
        - bug
    - title: Performance
      labels:
        - performance
    - title: Docs
      labels:
        - docs
        - documentation
    - title: Other changes
      labels:
        - "*"
